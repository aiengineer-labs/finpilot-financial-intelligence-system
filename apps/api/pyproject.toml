[project]
name = "finpilot-api"
version = "0.1.0"
description = "Tenant-safe FinPilot financial intelligence API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=50,<51",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.2.15",
  "nemoguardrails>=0.24.1,<0.25",
  "presidio-analyzer>=2.2.362,<3",
  "presidio-anonymizer>=2.2.362,<3",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "pyjwt>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20,<1",
  "hypothesis>=6.120,<7",
  "mypy>=1.14,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<7",
  "pyyaml>=6.0.2,<7",
  "ruff>=0.9,<1",
]

[tool.uv]
default-groups = ["dev"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# pytest's assertion idiom; application code stays subject to S101.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --disable-warnings"

[tool.coverage.run]
source = ["app"]
branch = true
